[package]
name = "meshflash"
version = "0.2.0"
edition = "2024"
description = "Desktop flasher for MeshCore firmware (ESP32 + nRF52)"
license = "MIT"
rust-version = "1.95"
readme = "README.md"

[dependencies]
# glow (OpenGL), not the wgpu default of eframe 0.36. glow keeps the binary
# small, and it is the renderer that the hardware test used.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
serialport = "4"
espflash = { version = "4", default-features = false, features = [
    "serialport",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = [
    "native-tls",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
anyhow = "1"
dirs = "6"
rfd = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
